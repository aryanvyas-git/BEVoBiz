services:
  db:
    image: pgvector/pgvector:pg16
    container_name: bevobiz_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bevobiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bevobiz_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-bevobiz}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bevobiz}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
